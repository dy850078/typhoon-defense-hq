<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>颱風天防衛總部</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game"></div>

  <!-- 角色創建 -->
  <div id="join" class="overlay">
    <form id="join-form" class="card">
      <h1>🌀 颱風天防衛總部</h1>
      <p class="sub">外面風雨交加，大家快進總部集合！</p>
      <div class="create">
        <canvas id="preview" width="128" height="160"></canvas>
        <div class="fields">
          <label>名字<input id="name" maxlength="12" placeholder="你的名字" autocomplete="off" required></label>
          <div class="label">動物</div>
          <div id="animals" class="chips"></div>
          <div class="label">毛色</div>
          <div id="colors" class="swatches"></div>
          <div class="label">雨衣</div>
          <div id="outfits" class="swatches"></div>
        </div>
      </div>
      <p id="join-error" class="error"></p>
      <button type="submit" class="primary">進入總部</button>
    </form>
  </div>

  <!-- 遊戲中介面 -->
  <div id="hud" hidden>
    <div id="banner">⚠️ 颱風警報發布中 · <span id="room-name">戶外</span> · <span id="online">0</span> 人在線</div>
    <div id="video-prompt" hidden>
      <span>📹 你在視訊會議室</span>
      <button id="video-btn" class="primary">加入視訊</button>
    </div>
    <div id="chat">
      <div id="messages"></div>
      <form id="chat-form">
        <input id="chat-input" maxlength="200" placeholder="按 Enter 聊天…" autocomplete="off">
      </form>
    </div>
    <div id="help">方向鍵 / WASD 移動 · 點地板也能走 · Enter 聊天</div>
  </div>

  <script src="/vendor/phaser.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/map.js"></script>
  <script src="/shared/avatar.js"></script>
  <script src="game.js"></script>
</body>
</html>
