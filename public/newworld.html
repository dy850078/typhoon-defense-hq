<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="robots" content="noindex">
  <title>新世界測試頁｜這不是一個單純的派對</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <style>
    /* 新世界測試頁：3D 淡黑線版的試玩場景，只有管理員帳號進得來，跟總部（hq.html）完全分開 */
    :root { --note: #FBF6E9; --note-ink: #2B2A33; --note-radius: 14px 9px 16px 10px / 10px 15px 9px 14px; --note-shadow: 2px 3px 0 rgba(43,42,51,.28); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe08e; color: var(--note-ink);
      font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
    #nw-canvas { position: fixed; inset: 0; display: block; }
    [hidden] { display: none !important; }
    .note { background: var(--note); border: 1.5px solid rgba(43,42,51,.55); border-radius: var(--note-radius); box-shadow: var(--note-shadow); }
    /* 進場前的說明、沒登入或不是管理員時的訊息 */
    #gate { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; z-index: 5; }
    #gate .note { max-width: 360px; padding: 20px 22px; text-align: center; }
    #gate h1 { font-size: 20px; margin: 0 0 8px; }
    #gate p { font-size: 14px; line-height: 1.7; margin: 0 0 12px; }
    #gate a { color: #B84300; font-weight: 700; }
    #gate-bar { height: 10px; border: 2px solid #5b4636; border-radius: 8px; overflow: hidden; margin: 0 6px 12px; background: #fffaf0; }
    #gate-bar[hidden] { display: none; }
    #gate-bar i { display: block; height: 100%; width: 0; background: #e8a23c; transition: width .15s; }
    /* 右上：一排手繪圖示鈕（職業、技能、裝備、背包…），手機收成一顆工具包。圖是 newworld-ui.js 畫的 */
    #btns { position: fixed; right: calc(8px + env(safe-area-inset-right)); top: calc(6px + env(safe-area-inset-top)); display: flex; flex-direction: column; align-items: flex-end; gap: 4px; z-index: 3; pointer-events: none; }
    #btns > * { pointer-events: auto; }
    #hb-row { display: flex; gap: 2px; }
    .hb { all: unset; box-sizing: border-box; width: 58px; display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; font: 700 11px/1.2 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; color: var(--note-ink); text-align: center; white-space: nowrap;
      border: 9px solid transparent; border-image: var(--nw-chip) 18 fill / 9px stretch; padding: 0 0 1px; -webkit-tap-highlight-color: transparent; }
    .hb[hidden] { display: none; }
    .hb img { width: 30px; height: 30px; display: block; }
    .hb:hover, .hb:focus-visible { border-image-source: var(--nw-chip-on); }
    .hb:active { transform: translate(1px, 2px); }
    #b-kit { display: none; }
    #hb-rider { display: flex; gap: 6px; }
    #hb-rider button { font: 700 12px/1.2 inherit; font-family: inherit; color: var(--note-ink); padding: 7px 10px; cursor: pointer; text-align: left; }
    #hb-rider button small { display: block; font-weight: 500; font-size: 11px; opacity: .7; margin-top: 2px; }
    @media (max-width: 820px) {
      #b-kit { display: flex; }
      #hb-row { display: none; flex-wrap: wrap; justify-content: flex-end; max-width: 184px; gap: 2px; }
      #btns.open #hb-row { display: flex; }
    }
    /* 共用的面板外殼：蠟筆描邊的紙、柚木標題列、花磚角。電腦在畫面中間，複雜的面板用寬版；手機從下面跳出來 */
    body #panel, body #dress, body #cb-book, .shell { background: none; box-shadow: none; border: 14px solid transparent; border-image: var(--nw-frame) 28 fill / 14px / 3px stretch; border-radius: 0; padding: 0 3px 4px; }
    .shell { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(400px, calc(100vw - 24px)); max-height: 64vh; overflow: auto; z-index: 4; font-size: 13px; line-height: 1.55; }
    body #panel h2, body #dress h2, body #cb-book h2, .shell h2 { position: sticky; top: 0; z-index: 2; margin: 0 -4px 9px; padding: 6px 7px 6px 40px; min-height: 40px; box-sizing: border-box; font-size: 15px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
      color: #fff7e6; text-shadow: 0 1px 0 rgba(43,42,51,.55); background: var(--nw-wood) center / 100% 100%; border: 1.5px solid var(--note-ink); border-radius: 9px 6px 10px 7px / 7px 10px 6px 9px; }
    body #panel h2::before, body #dress h2::before, body #cb-book h2::before, .shell h2::before { content: ''; position: absolute; left: 7px; top: 50%; width: 24px; height: 24px; margin-top: -13px; background: var(--nw-tile) center / cover; border: 1.5px solid var(--note-ink); border-radius: 4px 3px 5px 3px; transform: rotate(-4deg); }
    body #panel h2 button, body #dress h2 button, body #cb-book h2 button, .shell h2 button { font: 700 12px/1 inherit; font-family: inherit; color: var(--note-ink); padding: 6px 10px; cursor: pointer; flex: none; text-shadow: none; box-shadow: 1px 2px 0 rgba(43,42,51,.35); }
    .shell h3 { font-size: 13px; margin: 2px 0 6px; padding-bottom: 3px; border-bottom: 2px solid #7fa37a; display: inline-block; }
    .shell p { margin: 6px 0; } .shell .sub { font-size: 12px; opacity: .72; }
    .shell .opt, .shell a.opt { font: 500 13px/1.3 inherit; font-family: inherit; color: var(--note-ink); padding: 8px 11px; border-radius: 9px 6px 10px 7px; border: 1.5px solid rgba(43,42,51,.45); background: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
    .shell .opt:hover { background: #fff6dc; } .shell .opt:active { transform: translate(1px, 1px); } .shell .opt.warn { border-color: #b84300; color: #b84300; font-weight: 700; }
    .shell .opt small { font-size: 11px; font-weight: 700; background: #f3d27a; border-radius: 7px; padding: 2px 7px; margin-left: 4px; }
    .shell .opt .ic { width: 22px; height: 22px; flex: none; }
    .shell .acts { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
    .shell .rows { display: flex; flex-direction: column; gap: 6px; margin: 0 0 10px; } .shell .rows .opt { justify-content: space-between; }
    .shell .cols { display: grid; grid-template-columns: 1fr; gap: 2px 18px; }
    #stats { font-size: 12px; opacity: .75; }
    @media (min-width: 821px) {
      body #panel, body #dress, body #cb-book, .shell { top: 50%; bottom: auto; transform: translate(-50%, -50%); width: min(430px, calc(100vw - 24px)); max-height: calc(100vh - 230px); }
      .shell.wide { width: min(820px, calc(100vw - 48px)); } .shell.wide .cols { grid-template-columns: 1fr 1fr; }
    }
    body #cb-book .dbg { display: none; }   /* 職業面板底下那排管理員測試鈕搬到「功能測試」了 */
    /* 等級卡和任務紙條往上靠（原本上面那張測試用的卡拿掉了） */
    body #cb-me { top: calc(10px + env(safe-area-inset-top)); } body #cb-quest { top: calc(78px + env(safe-area-inset-top)); }
    /* 左下：搖桿 */
    #stick { position: fixed; left: calc(22px + env(safe-area-inset-left)); bottom: calc(26px + env(safe-area-inset-bottom)); width: 124px; height: 124px; border-radius: 50%;
      background: rgba(251,246,233,.55); border: 1.5px solid rgba(43,42,51,.45); z-index: 3; }
    #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: var(--note); border: 1.5px solid rgba(43,42,51,.6); box-shadow: var(--note-shadow); }
    #hint { position: fixed; left: 0; right: 0; bottom: calc(8px + env(safe-area-inset-bottom)); text-align: center; font-size: 11px; opacity: .65; pointer-events: none; z-index: 2; }
    /* 換裝面板：一張紙條，從下面跳出來 */
    #nw-labels { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
    .nw-tag { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; will-change: transform; }
    .nw-name { position: absolute; left: 0; top: 0; will-change: transform; font-weight: 700; font-size: 13px; line-height: 1.2; color: var(--note-ink); white-space: nowrap; pointer-events: none; text-shadow: 0 0 2px #fffaf0, 1px 1px 0 #fffaf0, -1px 1px 0 #fffaf0, 1px -1px 0 #fffaf0, -1px -1px 0 #fffaf0, 0 2px 3px rgba(43,42,51,.25); }
    .nw-name[hidden] { display: none; }
    .nw-name img { height: 20px; width: 20px; vertical-align: -5px; margin-right: 3px; }
    .nw-hint { position: absolute; left: 0; top: 0; pointer-events: auto; font: 700 12px/1.2 inherit; font-family: inherit; color: var(--note-ink); background: #fff3c4; border: 1.5px solid rgba(43,42,51,.55); border-radius: 8px 6px 9px 5px; padding: 6px 12px; cursor: pointer; white-space: nowrap; box-shadow: 1px 2px 0 rgba(43,42,51,.18); transform-origin: 50% 100%; }
    .nw-hint[hidden] { display: none; }
    /* 手繪版的紙條（newworld-hint.js 畫的圖）：外框和底色都在圖裡，按鈕本身透明；字留著給報讀和測試用 */
    .nw-hint.art { background: none; border: 0; padding: 0; box-shadow: none; border-radius: 0; }
    .nw-hint.art img { display: block; animation: nw-pop .16s ease-out, nw-bob 2s ease-in-out .16s infinite; transform-origin: 50% 100%; }
    .nw-hint.art.mini { background: #fbf6e9; border: 1.5px solid rgba(43,42,51,.7); border-radius: 50%; padding: 4px; box-shadow: 1px 2px 0 rgba(43,42,51,.25); opacity: .92; }
    .nw-hint.art.mini img { animation: none; }
    .nw-hint.art span { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; opacity: 0; }
    .nw-npc { position: absolute; left: 0; top: 0; will-change: transform; pointer-events: none; transition: opacity .3s; }
    @keyframes nw-pop { from { transform: scale(.6); } to { transform: scale(1); } }
    @keyframes nw-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    #acts { display: flex; gap: 6px; padding: 8px; width: min(250px, 100%); }
    #acts[hidden] { display: none; }
    #acts button { flex: 1; font: 500 12px/1 inherit; font-family: inherit; color: var(--note-ink); padding: 8px 4px; border-radius: 9px 6px 10px 7px; border: 1.5px solid rgba(43,42,51,.45); background: #fff; cursor: pointer; }
    #acts button.on { background: #ffe9a8; }
    #music-nw { position: fixed; width: 1px; height: 1px; left: -10px; top: -10px; opacity: 0; pointer-events: none; }
    .nw-bubble { max-width: 190px; font: 500 12px/1.4 inherit; font-family: inherit; color: var(--note-ink); background: #fff; border: 1.5px solid rgba(43,42,51,.5); border-radius: 12px 10px 13px 9px; padding: 5px 9px; overflow-wrap: anywhere; }
    #chat { position: fixed; left: calc(164px + env(safe-area-inset-left)); bottom: calc(34px + env(safe-area-inset-bottom)); width: min(380px, calc(100vw - 180px)); z-index: 3; display: flex; flex-direction: column; gap: 5px; }
    #chat-log { font-size: 12px; line-height: 1.5; max-height: 92px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; text-shadow: 0 0 3px #fbf5e6, 0 0 3px #fbf5e6, 0 0 2px #fbf5e6; }
    #chat-log b { font-weight: 700; }
    #chat form { display: flex; gap: 6px; }
    #emotes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; width: min(250px, 100%); }
    #emotes[hidden] { display: none; }
    #emotes button { font: 500 12px/1 inherit; font-family: inherit; color: var(--note-ink); padding: 8px 4px; border-radius: 9px 6px 10px 7px; border: 1.5px solid rgba(43,42,51,.45); background: #fff; cursor: pointer; }
    #chat input { all: unset; flex: 1; min-width: 0; font: 500 14px/1.2 inherit; font-family: inherit; color: var(--note-ink); background: rgba(251,246,233,.92); border: 1.5px solid rgba(43,42,51,.45); border-radius: 10px 8px 11px 7px; padding: 8px 10px; -webkit-user-select: text; user-select: text; }
    #chat button { font: 700 13px/1 inherit; font-family: inherit; color: var(--note-ink); padding: 8px 12px; cursor: pointer; }
    #dress { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(380px, calc(100vw - 24px)); max-height: 62vh; overflow: auto; padding: 12px 14px 14px; z-index: 4; font-size: 13px; }
    #dress h2 { font-size: 15px; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
    #dress h2 button { font: 700 12px/1 inherit; font-family: inherit; padding: 6px 10px; cursor: pointer; }
    #dress .row { display: flex; align-items: center; gap: 6px; margin: 7px 0; flex-wrap: wrap; }
    #dress .row > span { width: 44px; flex: none; font-weight: 700; }
    #dress .opt { font: 500 12px/1 inherit; font-family: inherit; color: var(--note-ink); padding: 7px 9px; border-radius: 9px 6px 10px 7px; border: 1.5px solid rgba(43,42,51,.45); background: #fff; cursor: pointer; }
    #dress .opt.on { background: #f3d27a; border-color: rgba(43,42,51,.8); font-weight: 700; }
    #dress .sw { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid rgba(43,42,51,.45); cursor: pointer; padding: 0; }
    #dress .sw.on { outline: 2.5px solid #2B2A33; outline-offset: 2px; }
    .nw-name.pet { font-size: 11px; font-weight: 500; opacity: .9; }
    /* 大廳的小面板：導師、扭蛋機、花圃、許願池共用一張紙條 */
    #panel { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(400px, calc(100vw - 24px)); max-height: 64vh; overflow: auto; padding: 12px 14px 14px; z-index: 4; font-size: 13px; line-height: 1.6; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
    #panel h2 { font-size: 15px; margin: 0 0 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    #panel h2 button { font: 700 12px/1 inherit; font-family: inherit; color: var(--note-ink); padding: 6px 10px; cursor: pointer; flex: none; }
    #panel p { margin: 6px 0; } #panel .sub, #panel .dim { font-size: 12px; opacity: .72; } #panel .err { color: #B84300; font-weight: 700; }
    #panel .opt { font: 500 13px/1.3 inherit; font-family: inherit; color: var(--note-ink); padding: 8px 11px; border-radius: 9px 6px 10px 7px; border: 1.5px solid rgba(43,42,51,.45); background: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-align: left; }
    #panel .opt.main { background: #ffe9a8; font-weight: 700; } #panel .opt.on { background: #f3d27a; border-color: rgba(43,42,51,.8); font-weight: 700; } #panel .opt:disabled { opacity: .45; cursor: default; }
    #panel .opt.big { display: flex; width: 100%; margin: 6px 0; } #panel .opt span, #panel .line span, #panel .result span { display: flex; flex-direction: column; } #panel small { font-size: 11px; font-weight: 500; opacity: .72; }
    #panel .ic { width: 24px; height: 24px; flex: none; }
    #panel .acts { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; align-items: center; }
    #panel .line { display: flex; align-items: center; gap: 8px; margin: 6px 0; } #panel .line .dim { margin-left: auto; }
    #panel .result { display: flex; align-items: center; gap: 10px; margin: 8px 0; padding: 8px 10px; border-radius: 10px 8px 11px 7px; border: 1.5px dashed rgba(43,42,51,.5); background: #fffaf0; }
    #panel .result.r-SR { background: #fff1cc; } #panel .result.r-SSR { background: #ffe0fa; }
    #panel .wishes { display: flex; flex-direction: column; gap: 6px; }
    #panel .wish { all: unset; display: flex; flex-direction: column; padding: 7px 10px; border-radius: 9px 6px 10px 7px; border: 1.5px solid rgba(43,42,51,.35); background: #fff; cursor: pointer; }
    #panel .title { font-size: 15px; font-weight: 700; } #panel .text { white-space: pre-wrap; overflow-wrap: anywhere; background: #fff; border-radius: 8px; padding: 8px 10px; -webkit-user-select: text; user-select: text; }
    #panel .cmt { font-size: 12px; border-left: 3px solid #e5cfa0; padding-left: 8px; overflow-wrap: anywhere; }
    #panel input, #panel textarea { all: unset; display: block; box-sizing: border-box; width: 100%; margin: 6px 0; font: 500 14px/1.5 inherit; font-family: inherit; color: var(--note-ink); background: #fff; border: 1.5px solid rgba(43,42,51,.45); border-radius: 10px 8px 11px 7px; padding: 8px 10px; -webkit-user-select: text; user-select: text; white-space: pre-wrap; overflow-wrap: anywhere; }
    #panel .tabs { display: flex; gap: 6px; margin: 4px 0 8px; } #panel .tabs .opt { flex: 1; justify-content: center; flex-direction: column; align-items: center; gap: 0; padding: 6px 4px; }
    #panel .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px; }
    #panel .cell { all: unset; box-sizing: border-box; position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px 4px; border-radius: 9px 6px 10px 7px; border: 1.5px solid rgba(43,42,51,.35); background: #fff; cursor: pointer; font-size: 11px; line-height: 1.25; text-align: center; }
    #panel .cell .ic { width: 34px; height: 34px; } #panel .cell i { position: absolute; right: 4px; top: 2px; font-style: normal; font-weight: 700; font-size: 11px; }
    #panel .cell.on { background: #f3d27a; border-color: rgba(43,42,51,.8); } #panel .cell.worn { border-style: dashed; border-color: #B84300; }
    #panel .cell.r-SR { background: #fff6dc; } #panel .cell.r-SSR { background: #ffe9fb; } #panel .cell.r-XR { background: #e3f4ff; } #panel .cell.on.r-SR, #panel .cell.on.r-SSR, #panel .cell.on.r-XR { background: #f3d27a; }
    #panel .worn-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 6px 0 10px; } #panel .worn-row .cell { cursor: default; min-height: 62px; justify-content: center; } #panel .worn-row .cell small { opacity: .6; }
    #panel .bar { height: 10px; border-radius: 6px; border: 1.5px solid rgba(43,42,51,.6); background: #fff; overflow: hidden; margin: 4px 0 8px; } #panel .bar b { display: block; height: 100%; background: #ff9db0; }
    #panel .song { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px dashed rgba(43,42,51,.25); } #panel .song span { flex: 1; min-width: 0; overflow-wrap: anywhere; } #panel .song .opt { flex: none; padding: 5px 9px; font-size: 12px; }
    #toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translateX(-50%); max-width: min(360px, calc(100vw - 150px)); padding: 8px 14px; font-size: 13px; font-weight: 700; z-index: 6; pointer-events: none; text-align: center; }
    @media (max-width: 520px) { #hint { display: none; } }
  </style>
</head>
<body>
  <div id="gate"><div class="note"><h1>新世界測試頁</h1><p id="gate-msg">確認身分中…</p><div id="gate-bar" hidden><i></i></div><p id="gate-link" hidden></p></div></div>

  <div id="btns" hidden>
    <button class="hb" id="b-kit" type="button" data-ic="btn-kit" aria-expanded="false"><span>工具包</span></button>
    <div id="hb-row">
      <button class="hb" id="b-cls" type="button" data-ic="nwc-sprout"><span>職業</span></button>
      <button class="hb" id="b-skill" type="button" data-ic="btn-book"><span>技能</span></button>
      <button class="hb" id="b-gear" type="button" data-ic="btn-gear"><span>裝備</span></button>
      <button class="hb" id="b-bag" type="button" data-ic="btn-bag" hidden><span>背包</span></button>
      <button class="hb" id="b-dress" type="button" data-ic="btn-dress" hidden><span>換裝</span></button>
      <button class="hb" id="b-pet" type="button" data-ic="btn-paw" hidden><span id="s-pet">寵物</span></button>
      <button class="hb" id="b-song" type="button" data-ic="btn-song"><span>點歌</span></button>
      <button class="hb" id="b-set" type="button" data-ic="btn-set"><span>設定</span></button>
      <button class="hb" id="b-test" type="button" data-ic="btn-test" hidden><span>功能測試</span></button>
    </div>
    <div id="hb-rider">
      <button class="note" id="b-form" hidden>隊形<small id="s-form">單手捧著</small></button>
      <button class="note" id="b-gesture" hidden>揮手指揮<small>機器人照做</small></button>
    </div>
  </div>
  <div id="set-panel" class="shell" hidden>
    <h2>設定<button class="note" type="button" data-shut>收起來</button></h2>
    <div class="rows">
      <button class="opt" type="button" id="b-zoom">鏡頭遠近<small id="s-zoom">遠</small></button>
      <button class="opt" type="button" id="b-quality">畫質<small id="s-quality">中</small></button>
      <button class="opt" type="button" id="b-lines">外框線<small id="s-lines">開</small></button>
    </div>
    <p class="sub">手機會燙的話，把畫質調低、外框線關掉。</p>
    <div class="acts"><a class="opt" href="hq.html">回總部</a></div>
  </div>
  <div id="test-panel" class="shell wide" hidden>
