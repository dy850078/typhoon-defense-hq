<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>颱風天防衛總部</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game"></div>

  <!-- 角色創建 -->
  <div id="join" class="overlay">
    <form id="join-form" class="card">
      <p class="eyebrow">TYPHOON DAY · DEFENSE HQ</p>
      <h1>颱風天防衛總部</h1>
      <p class="sub">外面風雨交加，大家快進總部集合！</p>
      <div class="create">
        <canvas id="preview" width="128" height="160"></canvas>
        <div class="fields">
          <label>名字<input id="name" maxlength="12" placeholder="你的名字" autocomplete="off" required></label>
          <div class="label">髮型</div>
          <div id="hairs" class="chips"></div>
          <div class="label">髮色</div>
          <div id="hair-colors" class="swatches"></div>
          <div class="label">膚色</div>
          <div id="skins" class="swatches"></div>
          <div class="label">雨衣</div>
          <div id="outfits" class="swatches"></div>
          <div class="label">眼鏡</div>
          <div id="glasses" class="chips"></div>
        </div>
      </div>
      <p id="join-error" class="error"></p>
      <button type="submit" class="primary">進入總部</button>
    </form>
  </div>

  <!-- 遊戲中介面 -->
  <div id="hud" hidden>
    <div id="banner"><span class="hot">● 颱風警報</span><span id="room-name">戶外</span><span class="mono"><span id="online">0</span> ONLINE</span></div>
    <div id="boss" hidden>
      <div class="boss-name"><span class="boss-lv">Lv.30</span> 薔琵 <span id="boss-pct" class="boss-pct">100%</span></div>
      <div class="boss-bar"><i id="boss-fill"></i></div>
    </div>
    <div id="stats">
      <div class="stat-row"><span id="cls-text" class="stat-cls"></span><span id="lv-text" class="stat-v lv"></span></div>
      <div class="stat-row" title="經驗值"><span class="stat-k">EXP</span><div class="stat-bar thin"><i id="exp-fill" class="exp"></i></div><span id="exp-text" class="stat-v"></span></div>
      <div class="stat-row"><span class="stat-k">HP</span><div class="stat-bar"><i id="hp-fill" class="hp"></i></div><span id="hp-text" class="stat-v"></span></div>
      <div class="stat-row"><span class="stat-k">MP</span><div class="stat-bar"><i id="mp-fill" class="mp"></i></div><span id="mp-text" class="stat-v"></span></div>
      <div class="stat-row"><span class="stat-k">ATK</span><span id="atk-text" class="stat-v"></span>
        <span class="stat-k def-k">DEF</span><span id="def-text" class="stat-v"></span></div>
    </div>
    <div id="inventory"></div>
    <div id="toasts"></div>
    <button id="action-btn" class="primary" hidden></button>
    <div id="skillbar">
      <button id="cake-btn" class="hud-btn" type="button" title="放下蛋糕" hidden>🎂<span> 放下蛋糕 <small id="cake-left"></small></span></button>
      <button id="fw-btn" class="hud-btn" type="button" title="放慶祝煙火">🎆</button>
      <button id="skills-open" class="hud-btn" type="button">📖<span> 技能</span></button>
      <button id="skill-btn" type="button"></button>
    </div>
    <div id="video-prompt" hidden>
      <span>🎖️ 你在戰情室</span>
      <button id="video-btn" class="primary">加入視訊</button>
      <button id="draw-btn" class="hud-btn" type="button">🎨 你畫我猜</button>
    </div>
    <div id="chat">
      <button id="chat-toggle" type="button">CHAT <span>▾</span></button>
      <div id="messages"></div>
      <form id="chat-form">
        <input id="chat-input" maxlength="200" placeholder="按 Enter 聊天…" autocomplete="off">
      </form>
    </div>
    <div id="help">方向鍵 / WASD 移動 · 點地板也能走 · 空白鍵 互動／攻擊 · K 職業技能 · 右鍵點人看個人資料 · Enter 聊天</div>
  </div>

  <div id="ctx-menu" hidden></div>

  <!-- 你畫我猜（戰情室） -->
  <div id="draw" class="overlay" hidden>
    <div class="card draw-card" role="dialog" aria-modal="true" aria-labelledby="draw-title">
      <button id="draw-x" type="button" aria-label="離開">✕</button>
      <h2 id="draw-title">🎨 你畫我猜</h2>
      <p id="draw-info" class="draw-info"></p>
      <div id="draw-vote" class="draw-vote" hidden><span id="draw-vote-text"></span><button id="draw-vote-yes" class="primary small" type="button">同意</button></div>
      <div class="draw-main">
        <div class="draw-board">
          <canvas id="draw-canvas" width="800" height="600"></canvas>
          <div class="draw-tools host-only">
            <div id="draw-colors" class="draw-colors"></div>
            <div id="draw-sizes" class="draw-sizes"></div>
            <button id="draw-clear" class="hud-btn tiny" type="button">🗑️ 清空</button>
          </div>
          <form id="draw-start-form" class="draw-start host-only">
            <input id="draw-answer" maxlength="12" placeholder="輸入答案（別人看不到）" autocomplete="off">
            <button class="primary small" type="submit">出題</button>
            <button id="draw-reveal" class="hud-btn tiny" type="button">公布答案</button>
          </form>
        </div>
        <div class="draw-side">
          <div id="draw-members" class="draw-members"></div>
          <div id="draw-log" class="draw-log"></div>
          <form id="draw-guess-form" class="draw-guess">
            <input id="draw-guess" maxlength="20" autocomplete="off">
            <button class="primary small" type="submit">送出</button>
          </form>
          <button id="draw-claim" class="hud-btn" type="button">🎤 搶主持棒</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 彈出視窗：背包、技能、轉職、煙火共用 -->
  <div id="modal" class="overlay" hidden>
    <div class="card modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-x" type="button" aria-label="關閉">✕</button>
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="/vendor/phaser.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/map.js"></script>
  <script src="crayon.js"></script>
  <script src="/shared/avatar.js"></script>
  <script src="/shared/stats.js"></script>
  <script src="/shared/gear.js"></script>
  <script src="/shared/decor.js"></script>
  <script src="creatures.js"></script>
  <script src="game.js"></script>
</body>
</html>
